name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json

      - name: Build Frontend (Vite)
        working-directory: UI
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Inject Production Database Credentials (.env)
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          echo "TURSO_DATABASE_URL=${TURSO_DATABASE_URL}" > .env
          echo "TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}" >> .env
          echo "COMPANY_NAME=شركة سكاي كورت للتجارة والتوزيع" >> .env
          echo "DEFAULT_CURRENCY=EGP" >> .env
          echo "DEFAULT_CURRENCY_SCALE=2" >> .env

      - name: Build Desktop Executable (PyInstaller)
        run: |
          pyinstaller run.spec

      - name: Copy .env into Distribution Folder
        shell: pwsh
        run: |
          Copy-Item -Path .env -Destination dist/WarehouseApp/.env -Force

      - name: Live Smoke Test WarehouseApp.exe on Windows
        shell: pwsh
        run: |
          Write-Host "Launching WarehouseApp.exe in Windows test environment..."
          $proc = Start-Process -FilePath "dist\WarehouseApp\WarehouseApp.exe" -PassThru -NoNewWindow
          Write-Host "Started process PID: $($proc.Id)"

          $ready = $false
          for ($i = 1; $i -le 15; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                  Write-Host "ERROR: WarehouseApp.exe exited prematurely with code $($proc.ExitCode)!"
                  if (Test-Path "dist\WarehouseApp\crash.log") {
                      Write-Host "=== CRASH.LOG CONTENT ==="
                      Get-Content "dist\WarehouseApp\crash.log"
                  }
                  exit 1
              }
              try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:5070/api/sync-status" -UseBasicParsing -TimeoutSec 2
                  if ($resp.StatusCode -eq 200) {
                      Write-Host "SUCCESS! Local Flask server on port 5070 returned HTTP 200:"
                      Write-Host $resp.Content
                      $ready = $true
                      break
                  }
              } catch {
                  Write-Host "Waiting for backend on port 5070... ($i/15)"
              }
          }

          if (-not $ready) {
              Write-Host "ERROR: Application did not respond on port 5070 within 15 seconds."
              if (Test-Path "dist\WarehouseApp\crash.log") {
                  Write-Host "=== CRASH.LOG CONTENT ==="
                  Get-Content "dist\WarehouseApp\crash.log"
              }
              Stop-Process -Id $proc.Id -Force
              exit 1
          }

          Write-Host "Smoke test PASSED! Shutting down test process..."
          Stop-Process -Id $proc.Id -Force

      - name: Compress Distribution to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WarehouseApp/* -DestinationPath dist/WarehouseApp-Windows.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseApp-Windows
          path: dist/WarehouseApp-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WarehouseApp-Windows.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
