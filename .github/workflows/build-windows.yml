name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json

      - name: Build Frontend (Vite)
        working-directory: UI
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Inject Production Database Credentials (.env)
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          echo "TURSO_DATABASE_URL=${TURSO_DATABASE_URL}" > .env
          echo "TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}" >> .env
          echo "COMPANY_NAME=شركة سكاي كورت للتجارة والتوزيع" >> .env
          echo "DEFAULT_CURRENCY=EGP" >> .env
          echo "DEFAULT_CURRENCY_SCALE=2" >> .env

      - name: Build Desktop Executable (PyInstaller)
        run: |
          pyinstaller run.spec

      - name: Copy .env into Distribution Folder
        shell: pwsh
        run: |
          Copy-Item -Path .env -Destination dist/WarehouseApp/.env -Force

      - name: Compress Distribution to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WarehouseApp/* -DestinationPath dist/WarehouseApp-Windows.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseApp-Windows
          path: dist/WarehouseApp-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WarehouseApp-Windows.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
